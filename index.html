<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080912">
<title>一棵圣诞树 · A little Christmas magic</title>
<style>
:root{color-scheme:dark;--accent:#edb3cc;--ink:#f7e9ee}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#080912;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 58% 44%,transparent 30%,#05060b80 100%)}header{position:absolute;top:35px;left:42px;right:42px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:3px;color:#ac9cae}.brand{display:flex;align-items:center;gap:12px}.brand span{font-size:19px;color:var(--accent)}.edition{font-family:Georgia,serif;letter-spacing:2px}.message{position:absolute;left:10%;top:34%;max-width:350px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:5px;color:var(--accent);margin:0 0 22px}h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;font-size:clamp(45px,5.2vw,78px);line-height:1.05;margin:0 0 27px;letter-spacing:-2px;text-shadow:0 0 35px #efa9c330}.rule{width:35px;height:1px;background:var(--accent);opacity:.6;margin-bottom:23px}.wish{font-size:14px;line-height:2.1;letter-spacing:2px;white-space:pre-wrap;overflow-wrap:anywhere;color:#c9b9c5;margin:0;max-width:300px}.signature{margin-top:24px;color:var(--accent);font-size:12px;letter-spacing:2px}.bottom{position:absolute;bottom:max(27px,env(safe-area-inset-bottom));left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;gap:14px}.hint{color:#8f8498;font-size:10px;letter-spacing:2px}.controls{display:flex;gap:7px;padding:7px;border:1px solid #d8bad51a;border-radius:30px;background:#11101d99;backdrop-filter:blur(15px)}button{font:inherit;color:#d8c8d6;background:transparent;border:0;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:hover{color:white;background:#e8c0df12}.controls button{font-size:11px;letter-spacing:1px;padding:10px 14px;border-radius:22px;white-space:nowrap}.controls .primary{background:#edb3cc;color:#261b29}.caption{position:absolute;left:64%;transform:translateX(-50%);bottom:16%;font-family:Georgia,serif;font-style:italic;font-size:12px;letter-spacing:3px;color:#cda9c477;pointer-events:none}dialog{width:min(440px,90vw);border:1px solid #554252;border-radius:20px;background:#14121e;color:var(--ink);padding:30px;box-shadow:0 25px 100px #0009}dialog::backdrop{background:#04040bbd;backdrop-filter:blur(8px)}dialog h2{margin:0 0 25px;font-family:Georgia,"PingFang SC",serif;font-size:24px;font-weight:400}label{display:block;font-size:12px;color:#c2adbf;margin:16px 0 8px}input,textarea{width:100%;background:#080912;border:1px solid #4b3849;border-radius:8px;padding:12px;font:inherit;font-size:14px;color:#f5e3ef;resize:vertical}textarea{min-height:110px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.actions button{padding:10px 18px;border-radius:8px;background:#302332}.actions .save{background:#edb3cc;color:#261b29}.note{font-size:11px;color:#a18da1;line-height:1.8;margin-top:20px}.toast{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);background:#302334;border:1px solid #765568;color:#f7ddea;font-size:12px;padding:12px 20px;border-radius:25px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}noscript{position:absolute;top:50%;left:10%;color:white}
@media(max-width:700px){header{top:24px;left:23px;right:23px}.edition{font-size:9px}.message{top:12%;left:0;max-width:none;width:100%;text-align:center;padding:0 25px}.eyebrow{font-size:9px;margin-bottom:12px;letter-spacing:4px}h1{font-size:43px;margin-bottom:14px}h1 br{display:none}h1 br:after{content:" "}.rule{display:none}.wish{font-size:11px;line-height:1.8;letter-spacing:1px;max-width:100%}.signature{font-size:10px;margin-top:9px}.bottom{left:10px;right:10px;bottom:max(20px,env(safe-area-inset-bottom));justify-content:center}.hint{display:none}.controls{gap:0;padding:5px}.controls button{font-size:10px;padding:10px 11px}.caption{left:50%;bottom:14%;font-size:10px}.brand{letter-spacing:2px}.toast{bottom:85px}}
@media(max-height:600px) and (min-width:701px){.message{top:27%}h1{font-size:48px}.eyebrow{margin-bottom:12px}.wish{font-size:12px}.rule{margin-bottom:12px}.caption{display:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="缓缓旋转的粉色粒子圣诞树，树顶爱心闪烁，雪花飘落">动态圣诞树需要支持 Canvas 的浏览器。</canvas><div class="vignette"></div>
<header><div class="brand"><span>✧</span> A LITTLE CHRISTMAS MAGIC</div><div class="edition">DECEMBER · 25</div></header>
<main class="message"><p class="eyebrow">A GIFT OF LIGHT, JUST FOR YOU</p><h1>Merry<br> Christmas</h1><div class="rule"></div><p class="wish" id="wish"></p><p class="signature" id="signature"></p></main>
<div class="caption">make a wish upon the light</div>
<footer class="bottom"><span class="hint">拖动旋转 · 点击点亮星光</span><div class="controls"><button id="theme" aria-label="切换配色">配色 · 绯樱</button><button id="snow" aria-pressed="true">飘雪 · 开</button><button id="pause" aria-pressed="false">暂停</button><button id="edit">写祝福</button><button id="download" class="primary">保存贺卡 ↗</button></div></footer>
<dialog id="editor"><form id="form"><h2>把祝福，藏进星光里。</h2><label for="wishInput">祝福语（最多 60 字）</label><textarea id="wishInput" maxlength="60" required></textarea><label for="nameInput">署名（最多 20 字，可留空）</label><input id="nameInput" maxlength="20" placeholder="来自，想念你的人"><p class="note">修改后点击「保存贺卡」，即可把带着祝福的 HTML 文件发给朋友。无需联网或安装软件。</p><div class="actions"><button type="button" id="cancel">取消</button><button type="submit" class="save">点亮祝福</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div><noscript>请在浏览器中启用 JavaScript，以观看动态圣诞树。</noscript>
<!-- 独立离线版。创意参考：https://github.com/ZekangLi-Zico/Christmas-Tree
     原项目为 Python/Pygame；此文件以原生 Canvas 独立实现，无外部资源。 -->
<script id="card-config" type="application/json">{"wish":"愿所有美好，都如期而至。\n愿你的冬天，有光，也有温暖。","name":"送给特别的你 ♡","theme":0}</script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');
const config=JSON.parse($('card-config').textContent);
const palettes=[{name:'绯樱',rgb:[255,157,201],accent:'#edb3cc'},{name:'鎏金',rgb:[255,204,116],accent:'#ebcc8a'},{name:'冰蓝',rgb:[139,215,255],accent:'#abdcee'}];
let theme=Number(config.theme)||0;theme=((theme%3)+3)%3;
let w=0,h=0,dpr=1,time=0,angle=0,paused=false,snowOn=true,last=0,drag=null,dragged=false,burst=[],toastTimer;
let cx,base,scale,mobile;const TAU=Math.PI*2,random=(a,b)=>a+Math.random()*(b-a);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;paused=reduced;
const points=[],ground=[],sky=[],flakes=[];
// 树身：细密的填充粒子与九圈螺旋灯带，在三维空间绕 Y 轴旋转。
for(let i=0;i<11500;i++){let spiral=i<7600,u=Math.random(),q=spiral?Math.pow(u,1.35):Math.pow(u,1.6),y=q*10;
let wave=Math.max(0,Math.sin((q*5.8+.15)*TAU)),radius=Math.pow(1-q,1.08)*(2.8+wave*.72);
let a=spiral?u*9*TAU+random(-.14,.14):Math.random()*TAU;
let r=radius*(spiral?random(.91,1.06):Math.sqrt(Math.random()));
points.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,size:random(.5,1.25),phase:Math.random()*TAU,light:Math.random()<.035,bright:spiral?random(.45,.92):random(.15,.48)});}
for(let i=0;i<1900;i++){let a=Math.random()*TAU,r=[3.4,4.1,4.9,5.8][i%4]+random(-.07,.07);ground.push({x:Math.cos(a)*r,y:-.16,z:Math.sin(a)*r,phase:Math.random()*TAU});}
for(let i=0;i<130;i++)sky.push({x:Math.random(),y:Math.random(),r:random(.35,1.2),phase:Math.random()*TAU});
for(let i=0;i<65;i++)flakes.push({x:Math.random(),y:Math.random(),r:random(.6,2.4),v:random(.015,.05),phase:Math.random()*TAU});
const glow=document.createElement('canvas');glow.width=glow.height=40;let gc=glow.getContext('2d');let grad=gc.createRadialGradient(20,20,0,20,20,20);grad.addColorStop(0,'#fff');grad.addColorStop(.12,'#fff9');grad.addColorStop(.35,'#fff2');grad.addColorStop(1,'#fff0');gc.fillStyle=grad;gc.fillRect(0,0,40,40);
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.7);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);mobile=w<=700;cx=w*(mobile?.5:.64);base=h*(mobile?.79:.80);scale=Math.min(h*(mobile?.038:.055),w*(mobile?.061:.049));}
addEventListener('resize',resize);resize();
function project(x,y,z,c,s){let xx=x*c-z*s,zz=x*s+z*c,p=19/(19+zz);return [cx+xx*scale*p,base-(y+zz*.23)*scale*p,p,zz];}
function spark(x,y,r,alpha){ctx.globalAlpha=alpha;ctx.drawImage(glow,x-r,y-r,r*2,r*2);}
function render(now){let dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!paused){time+=dt;angle+=dt*.22;}const t=time,c=Math.cos(angle),s=Math.sin(angle),col=palettes[theme].rgb;
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#080912';ctx.fillRect(0,0,w,h);
let haze=ctx.createRadialGradient(cx,base-scale*4,0,cx,base-scale*4,scale*8);haze.addColorStop(0,`rgba(${col},.055)`);haze.addColorStop(1,'rgba(8,9,18,0)');ctx.fillStyle=haze;ctx.fillRect(0,0,w,h);
for(const p of sky){ctx.fillStyle='#d8d4f5';ctx.globalAlpha=.15+.35*(.5+.5*Math.sin(t*.6+p.phase));ctx.fillRect(p.x*w,p.y*h,p.r,p.r);}
ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgb(${col})`;
for(const p of ground){let v=project(p.x,p.y,p.z,c,s);ctx.globalAlpha=(.13+.23*(.5+.5*Math.sin(p.phase+t)))*(.8+v[3]*.035);ctx.fillRect(v[0],v[1],.9*v[2],.9*v[2]);}
for(const p of points){let v=project(p.x,p.y,p.z,c,s),alpha=p.bright*(.7+.3*Math.sin(t*1.7+p.phase));ctx.globalAlpha=alpha;let r=p.size*v[2]*(mobile?.85:1);ctx.fillStyle=p.light?'#fff2e7':`rgb(${col})`;ctx.fillRect(v[0],v[1],r,r);if(p.light)spark(v[0],v[1],r*4,alpha*.6);}
// 面向观看者的心形粒子顶饰，轻轻跳动。
let top=project(0,10.65,0,c,s),pulse=1+Math.sin(t*2)*.045;ctx.fillStyle=`rgb(${col})`;
for(let i=0;i<170;i++){let a=i/170*TAU,x=16*Math.pow(Math.sin(a),3),y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);let k=scale*.033*pulse,px=top[0]+x*k,py=top[1]-y*k;ctx.globalAlpha=.7;ctx.fillRect(px,py,1.1,1.1);if(i%5===0)spark(px,py,5,.35);}
spark(top[0],top[1],scale*.85,.13);
if(snowOn){ctx.fillStyle='#eee7ff';for(const f of flakes){if(!paused){f.y+=dt*f.v;if(f.y>1.04){f.y=-.04;f.x=Math.random();}}let x=f.x*w+Math.sin(t*.4+f.phase)*16,y=f.y*h;ctx.globalAlpha=.18+f.r*.13;ctx.beginPath();ctx.arc(x,y,f.r,0,TAU);ctx.fill();if(f.r>2)spark(x,y,f.r*5,.18);}}
for(let i=burst.length-1;i>=0;i--){const p=burst[i];if(!paused){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=18*dt;}if(p.life<=0){burst.splice(i,1);continue;}spark(p.x,p.y,7,Math.min(1,p.life)*.8);}
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';requestAnimationFrame(render);}
function apply(){document.documentElement.style.setProperty('--accent',palettes[theme].accent);$('wish').textContent=config.wish;$('signature').textContent=config.name;$('theme').textContent='配色 · '+palettes[theme].name;$('pause').textContent=paused?'继续':'暂停';$('pause').setAttribute('aria-pressed',String(paused));}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
$('theme').onclick=()=>{theme=(theme+1)%palettes.length;config.theme=theme;apply();};
$('pause').onclick=()=>{paused=!paused;apply();};
$('snow').onclick=()=>{snowOn=!snowOn;$('snow').textContent='飘雪 · '+(snowOn?'开':'关');$('snow').setAttribute('aria-pressed',String(snowOn));};
$('edit').onclick=()=>{$('wishInput').value=config.wish;$('nameInput').value=config.name;$('editor').showModal();};$('cancel').onclick=()=>$('editor').close();
$('form').onsubmit=e=>{e.preventDefault();config.wish=$('wishInput').value.trim()||'圣诞快乐，愿你平安喜乐。';config.name=$('nameInput').value.trim();apply();$('editor').close();toast('祝福已点亮 · 保存贺卡即可分享');};
$('download').onclick=()=>{const copy=document.documentElement.cloneNode(true);copy.querySelector('#card-config').textContent=JSON.stringify(config).replace(/</g,'\\u003c');copy.querySelector('#editor').removeAttribute('open');copy.querySelector('#toast').classList.remove('show');copy.querySelector('#wishInput').textContent='';copy.querySelector('#nameInput').removeAttribute('value');const blob=new Blob(['<!DOCTYPE html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='送你一棵圣诞树.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('贺卡已生成，请将下载的 HTML 文件发给朋友');};
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,startX:e.clientX,startY:e.clientY};dragged=false;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;angle+=dx*.009;drag.x=e.clientX;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>6)dragged=true;});
canvas.addEventListener('pointerup',e=>{if(!dragged&&!paused)for(let i=0;i<35;i++){let a=Math.random()*TAU,v=random(20,100);burst.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:random(.6,1.6)});}drag=null;});canvas.addEventListener('pointercancel',()=>drag=null);
apply();requestAnimationFrame(render);
})();
</script>
</body>
</html>
